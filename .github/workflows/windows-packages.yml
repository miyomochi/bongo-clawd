name: Windows packages
on:
  push:
    branches: ['release/stable-*', 'release/beta-*']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: 1
    steps:
      - name: Cancel superseded release builds
        if: github.ref_name == 'release/stable-0.4.0'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?branch=release/stable-0.4.0&status=in_progress" | ConvertFrom-Json
          foreach ($run in $runs.workflow_runs) {
            if ($run.id -ne [long]$env:GITHUB_RUN_ID -and $run.head_sha -ne $env:GITHUB_SHA) {
              gh run cancel $run.id --repo $env:GITHUB_REPOSITORY
            }
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frontend checks
        shell: pwsh
        run: |
          python scripts/build-frontend.py
          python scripts/build-reach-preview.py
          python scripts/build-click-preview.py
          if (Test-Path scripts/build-update-preview.py) { python scripts/build-update-preview.py }
          python scripts/build-accessory-carousel-preview.py
          node --test tests/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend checks failed' }
          python scripts/verify-assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Asset checks failed' }
      - name: Rust core checks
        shell: pwsh
        run: |
          rustup show
          cargo test --manifest-path core-tests/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed' }
      - name: Verify stable provenance
        if: startsWith(github.ref_name, 'release/stable-')
        run: python scripts/verify-edition.py stable
      - name: Build portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build installer and checksums
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          ./scripts/build-installer.ps1 -PackageDirectory "dist/Bongo-Clawd-$version-Windows-x64" -Version $version -MakeNSIS "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          Compress-Archive -Path "dist/Bongo-Clawd-$version-Windows-x64-Setup.exe" -DestinationPath "dist/Bongo-Clawd-$version-Windows-x64-Setup.zip" -Force
          Get-ChildItem dist/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - name: Verify update package extraction
        shell: pwsh
        run: ./scripts/verify-update-package.ps1
      - name: Verify silent in-place update
        shell: pwsh
        run: ./scripts/verify-inplace-update.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Bongo-Clawd-Windows-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish 0.4.0 and update release feeds
        if: github.ref_name == 'release/stable-0.4.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-stable.py
