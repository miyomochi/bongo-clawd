<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Clawd · 耳机与小工位实验台</title><style>html,body{margin:0;background:light-dark(#f5f2eb,#20211e)}body{padding:16px 10px}</style></head><body><div id="clawd-keyboard-study">
<style>    #clawd-keyboard-study { color-scheme: light dark; padding: 8px 0; color: light-dark(#413b34,#eee6db); font-family: ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #clawd-keyboard-study * { box-sizing: border-box; }
    #clawd-keyboard-study .workbench { max-width: 780px; margin: 0 auto; background: light-dark(#faf7f0,#292822); border: 1px solid light-dark(#d9d2c5,#514c40); border-radius: 20px; overflow: hidden; }
    #clawd-keyboard-study .bench-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 0; }
    #clawd-keyboard-study .bench-title { font-weight: 500; font-size: 16px; letter-spacing: .02em; }
    #clawd-keyboard-study .edition { display: block; font-family: ui-monospace,monospace; font-size: 11px; margin-top: 5px; color: light-dark(#847768,#baad98); letter-spacing: .1em; }
    #clawd-keyboard-study .state-tag { font-size: 12px; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    #clawd-keyboard-study .state-dot { width: 6px; height: 6px; background: #9aa787; }
    #clawd-keyboard-study[data-state="typing"] .state-dot { background: #d97757; }
    #clawd-keyboard-study[data-state="mouse"] .state-dot { background: #c5a56b; }
    #clawd-keyboard-study .scene { margin: 0 12px; touch-action: pan-y; }
    #clawd-keyboard-study #clawd-scene { width: 100%; height: auto; display: block; max-height: 470px; }
    #clawd-keyboard-study .key-top, #clawd-keyboard-study #mouse-shell { transition: fill 65ms linear; }
    #clawd-keyboard-study .key.is-down .key-top { fill: #f2bf72; }
    #clawd-keyboard-study .key.is-down .key-legend { fill: #3c3126; }
    #clawd-keyboard-study .is-clicked { fill: #f2bf72; }
    #clawd-keyboard-study[data-state="busy"] .state-dot { background: #d97757; }
    #clawd-keyboard-study .input-area { padding: 0 22px 20px; }
    #clawd-keyboard-study .input-label { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    #clawd-keyboard-study [data-last-key] { color: light-dark(#996047,#f0b294); font-family: ui-monospace,monospace; }
    #clawd-keyboard-study textarea { width:100%; display:block; min-height:66px; resize:vertical; padding:12px 14px; font:16px/1.5 ui-monospace,monospace; color:light-dark(#413b34,#eee6db); background:light-dark(#fffdf8,#33312b); border:1px solid light-dark(#d9d2c5,#5d5649); border-radius:10px; }
    #clawd-keyboard-study textarea::placeholder { color:light-dark(#8d8173,#b2a591); }
    #clawd-keyboard-study .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    #clawd-keyboard-study button { min-height:42px; padding:9px 15px; border-radius:8px; border:1px solid light-dark(#d8cfc1,#5e5546); color:light-dark(#55483a,#f0e4d4); background:light-dark(#f0e9dc,#39352c); font-family:inherit; font-size:13px; font-weight:500; line-height:1.3; }
    #clawd-keyboard-study button[data-action="demo"] { background:light-dark(#d97757,#b85c40); color:#fff8f1; border-color:transparent; margin-left:auto; }
    @media(max-width:480px) { #clawd-keyboard-study .bench-head{padding:16px 15px 0;align-items:flex-start} #clawd-keyboard-study .input-area{padding:0 15px 16px} #clawd-keyboard-study .state-tag{font-size:12px;white-space:normal;max-width:46%} #clawd-keyboard-study .actions{display:grid;grid-template-columns:1fr 1fr} #clawd-keyboard-study button[data-action="demo"]{margin-left:0} #clawd-keyboard-study .scene{margin:6px 0} }
    @media(prefers-reduced-motion:reduce){#clawd-keyboard-study .key-top{transition:none}}

    #clawd-keyboard-study button:disabled { opacity:.45; }
    #clawd-keyboard-study[data-state="waking"] .state-dot { background:#d97757; }

#clawd-keyboard-study [data-action="cool"]{background:light-dark(#302c27,#e9dfcb);color:light-dark(#fff7df,#302c27);border-color:transparent}
#clawd-keyboard-study [data-state="cool"] .state-dot{background:#edbf55}
#clawd-keyboard-study [data-action="happy"]{background:light-dark(#f5dce1,#51363e);color:light-dark(#794554,#ffe3eb);border-color:light-dark(#e3b8c3,#7c5560)}
#clawd-keyboard-study[data-state="happy"] .state-dot{background:#e88b9e}

#clawd-keyboard-study .motif-picker{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px}
#clawd-keyboard-study .motif-picker span{opacity:.7}
#clawd-keyboard-study select{min-height:36px;border:1px solid light-dark(#d8cfc1,#5e5546);border-radius:7px;background:light-dark(#fffaf3,#39352c);color:inherit;padding:5px 8px;font:inherit}

#clawd-keyboard-study [hidden]{display:none!important}
#clawd-keyboard-study .accessory-toolbar{display:flex;align-items:center;gap:12px;padding:0 22px 16px;font-size:12px}
#clawd-keyboard-study .accessory-menu{margin:0 22px 20px;padding:18px;border:1px solid light-dark(#9fc9d7,#547b8b);border-radius:12px;background:light-dark(#edf6f8,#28383d)}
#clawd-keyboard-study .accessory-heading{display:flex;justify-content:space-between;gap:12px;font-weight:600}
#clawd-keyboard-study .accessory-heading span,#clawd-keyboard-study .accessory-menu p{font-size:12px;font-weight:400;opacity:.75}
#clawd-keyboard-study .accessory-options{display:flex;flex-wrap:wrap;gap:12px}
#clawd-keyboard-study .accessory-options label{padding:12px;border:1px solid light-dark(#b7d2dc,#587a87);border-radius:8px;font-size:14px;cursor:pointer}
#clawd-keyboard-study [data-accessory-confirm]{background:#82c5e6;color:#203c4a;border-color:transparent}
#clawd-keyboard-study[data-state="accessory"] .state-dot{background:#82c5e6}
</style>

(function (global) {
  'use strict';
  const modules = global.ClawdModules || (global.ClawdModules = {});
  modules.renderer = function (ctx) {
    function setStatus(text, kind) {
      if(ctx.status.textContent!==text)ctx.status.textContent = text;
      ctx.root.dataset.state = kind || 'idle';
    }

    function pose(hand, state) {
      (hand === 'left' ? ctx.left : ctx.right).innerHTML = ctx.rig[hand][state];
      ctx.root.dataset[hand] = state;
    }

    function cancelHand(hand) {
      ctx.handTimers[hand].forEach(clearTimeout);
      ctx.handTimers[hand] = [];
    }

    function refreshEyes() {
      const surge = ctx.level > 0 && performance.now() < ctx.surgeUntil;
      const recovering = performance.now() < ctx.recoveryUntil;
      const entering = ctx.level > 0 && performance.now() < ctx.enteringUntil;
      const sleeping = ctx.sleepPhase!=='awake';
      const waking=ctx.wakePhase!=='none';
      const happy=ctx.happyOwnsEyes?.()&&!ctx.level&&!recovering&&!entering;
      const selected = ctx.accessoryPreview ? ctx.headphoneEyes : waking ? (ctx.wakePhase==='startled' ? ctx.startledEyes : ctx.wakePhase==='checking' ? ctx.sneakEyes : ctx.wakePhase==='pretending' ? ctx.busyEyes : ctx.blinkEyes) : sleeping ? ctx.blinkEyes : ctx.looking ? (ctx.squint ? ctx.sneakEyes : ctx.openEyes) : (recovering || entering) ? ctx.blinkEyes : surge ? ctx.wideEyes : ctx.level ? ctx.busyEyes : happy ? ctx.happyEyes : ctx.blinking ? ctx.blinkEyes : ctx.openEyes;
      [ctx.openEyes, ctx.blinkEyes, ctx.busyEyes, ctx.wideEyes, ctx.sneakEyes, ctx.startledEyes,ctx.happyEyes,ctx.headphoneEyes].filter(Boolean).forEach(el => el.setAttribute('display', el === selected ? 'inline' : 'none'));
      [ctx.openEyes,ctx.sneakEyes].forEach(el=>el.setAttribute('transform', `translate(${ctx.reduceMotion ? 0 : (waking ? ctx.wakeEyeX : ctx.eyeX)} ${ctx.reduceMotion ? 0 : (waking ? 0 : ctx.eyeY+(ctx.coolEyeY||0))})`));
      ctx.root.dataset.expression = ctx.accessoryPreview ? (ctx.accessoryExpression||'headphones') : waking ? ctx.wakePhase : sleeping ? 'sleeping' : ctx.looking ? (ctx.squint ? 'sneak' : 'looking') : recovering ? 'recovering' : entering ? 'entering' : surge ? 'wide' : ctx.level ? 'busy' : happy ? 'happy' : ctx.blinking ? 'blink' : 'open';
    }

    function renderBody() {
      const surge = ctx.level > 0 && performance.now() < ctx.surgeUntil;
      const now = performance.now();
      const breathing = now < ctx.recoveryUntil && now-ctx.lastStroke > 220 && !ctx.held.size;
      const breath = breathing ? Math.round(1.5-1.5*Math.cos((now-ctx.recoveryStart)*Math.PI*2/1000)) : 0;
      let bodyX=ctx.lookX, bodyY=ctx.bounceOffset+(surge ? -5 : 0)+breath+ctx.lookY;
      let handsX=ctx.lookX, handsY=Math.min(0,ctx.bounceOffset)+(surge ? -2 : 0)+ctx.lookY;
      if(ctx.sleepPhase==='stretch') {
        const progress=Math.min(1,ctx.sleepClock/650);
        bodyX=0;bodyY=-Math.round(4*progress);handsX=0;handsY=-Math.round(3*progress);
      } else if(ctx.sleepPhase==='settling') {
        const progress=Math.min(1,(ctx.sleepClock-1250)/1150);
        const eased=progress*progress*(3-2*progress);
        bodyX=-Math.round(2*eased);bodyY=Math.round(-4+9*eased);handsX=0;handsY=0;
      } else if(ctx.sleepPhase==='asleep') {
        const t=(ctx.sleepClock-2400)/3600;
        bodyX=-2;bodyY=5+Math.round(1-Math.cos(t*Math.PI*2));handsX=0;handsY=0;
      }
      if(ctx.wakePhase!=='none') {
        bodyX=ctx.wakeX;bodyY=ctx.wakeY+ctx.bounceOffset;
        handsX=ctx.wakeX;handsY=ctx.wakeY+Math.min(0,ctx.bounceOffset);
        if(ctx.wakePhase==='calming')bodyY+=Math.round(1-Math.cos((ctx.wakeClock-3600)*Math.PI*2/600));
      }
      bodyY+=ctx.coolBodyY||0;handsY+=ctx.coolBodyY||0;
      if(ctx.reduceMotion)bodyX=bodyY=handsX=handsY=0;
      let bodyTransform=`translate(${bodyX} ${bodyY})`;
      if(ctx.accessoryPreview){
        const p=ctx.accessoryPulse||0;
        bodyX=ctx.reduceMotion?0:-Math.round(p);bodyY=ctx.reduceMotion?0:Math.round(2*p);
        bodyTransform=`translate(${bodyX} ${bodyY}) translate(118 96) scale(${(1+.008*p).toFixed(4)} ${(1-.035*p).toFixed(4)}) translate(-118 -96)`;
        handsX=handsY=0;
      }
      ctx.body.setAttribute('transform',bodyTransform);
      ctx.hands.setAttribute('transform',`translate(${handsX} ${handsY})`);
      ctx.anchorHappy?.(bodyX,bodyY);
      const occlusion=ctx.accessoryPreview?bodyTransform:`translate(${bodyX-handsX} ${bodyY-handsY})`;
      ctx.armClip.setAttribute('transform',occlusion);
      ctx.raisedClip.setAttribute('transform',occlusion);

    }

    function refreshStatus() {
      const happyButton=ctx.root.querySelector('[data-action="happy"]');
      if(happyButton)happyButton.disabled=ctx.sleepPhase!=='awake'||ctx.wakePhase!=='none'||!!ctx.level||performance.now()<ctx.recoveryUntil;
      const wakeButton=ctx.root.querySelector('[data-action="wake"]');
      if(wakeButton)wakeButton.disabled=ctx.sleepPhase!=='asleep';
      if(ctx.isAdjusting?.()){ctx.setStatus(ctx.accessoryPreview?(ctx.accessoryCaption||'装饰试穿中……'):'装饰试穿中 · 工作暂停','accessory');return;}
      if(ctx.wakePhase!=='none')ctx.setStatus(ctx.wakePhase==='startled' ? '哇！' : ctx.wakePhase==='checking' ? '谁、谁来了？' : ctx.wakePhase==='pretending' ? '我没睡！我在敲！' : '呼……继续工作', 'waking');
      else if (ctx.sleepPhase==='asleep') ctx.setStatus(ctx.happyPhase==='dreaming'?'做一个甜甜的梦……':'呼……Zzz', 'asleep');
      else if(ctx.sleepPhase!=='awake')ctx.setStatus('伸个懒腰……困了', 'sleepy');
      else if(ctx.coolPhase&&ctx.coolPhase!=='none')ctx.setStatus(({fetching:'偷偷摸一副墨镜……',lifting:'慢慢戴上……',adjusting:'扶一下，戴好了',wearing:'全工位最酷的小蟹',leaving:'耍帅结束，继续啪嗒'})[ctx.coolPhase], 'cool');
      else if (ctx.looking) ctx.setStatus('偷偷看看……没人吧？', 'looking');
      else if (ctx.mouseMode) ctx.setStatus(ctx.root.dataset.left!=='idle' ? '左手啪嗒，右手挪鼠标' : '小幅挪动鼠标', 'mouse');
      else if (ctx.level) ctx.setStatus(ctx.level === 2 ? '啪嗒啪嗒，忙不过来了！' : '小蟹正在奋力工作', 'busy');
      else if (performance.now() < ctx.recoveryUntil) ctx.setStatus(performance.now()-ctx.lastStroke < 220 || ctx.held.size ? '一边缓口气，一边啪嗒' : '呼……缓口气', 'recovering');
      else if(ctx.happyPhase==='smiling')ctx.setStatus('想到一点开心的事……', 'happy');
